name: CI

on:
  push:
    branches:
      - fork

  pull_request:
    branches:
      - fork

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        node: [lts/*]
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/setup@v3
        with:
          runtime: node@lts
          cache: true

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
